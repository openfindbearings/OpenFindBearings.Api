apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-api
  namespace: openfindbearings
  labels:
    app: openfindbearings-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # 改动说明：发版失败根因之二——Deployment 服务端 progressDeadlineSeconds 默认 600s，
  #   新 RS 10 分钟内未 ready 即判 rollout 失败（kubectl rollout status 随即报错、CI 回滚），
  #   CI 侧 20m 客户端超时管不到它。GHCR 慢拉窗口下镜像下载就超 10 分钟，必踩。
  #   放宽到 30 分钟，与 startupProbe（5m 启动预算）+ CI 20m 超时形成合理梯度
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: openfindbearings-api
  template:
    metadata:
      labels:
        app: openfindbearings-api
    spec:
      # 改动说明（v1.5.0）：用户上传改走 MinIO 对象存储（minio.yml），原 wwwroot/uploads
      # hostPath 卷 + uploads-init chown hack 一并废弃（权限问题根因消除）
      containers:
      - name: openfindbearings-api
        image: ghcr.io/openfindbearings/openfindbearings-api:latest
        ports:
        - containerPort: 8080

        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: POD_NETWORK_CIDR
          value: "<your-pod-cidr>"  # 根据实际集群配置
        - name: SERVICE_NETWORK_CIDR
          value: "<your-service-cidr>"
        # 改动说明（2026-11-07）：改用 Workstation GC。崩溃全部发生在 .NET Server GC 线程
        #   （libc 内 general protection fault，exit 139），且该服务 CPU 占用极低，Server GC 无收益
        - name: DOTNET_gcServer
          value: "0"
        # 改动说明（2026-11-07）：关闭 .NET W^X 可执行页切换，规避 kernel 7.0.0-43 + libc 2.43 下
        #   libc 固定偏移 general protection fault（exit 139），崩溃线程随机（BGC / TP Worker）
        - name: DOTNET_EnableWriteXorExecute
          value: "0"
        envFrom:
        - secretRef:
            name: openfindbearings-api-secrets
        - configMapRef:
            name: openfindbearings-api-config
        
        # 改动说明（v1.31.0）：启动探针——迁移+Seed 在端口监听前同步执行，慢迁移期 liveness 会误杀
        #   （杀→重迁→恶性循环直到 rollout 超时回滚，API 发版高失败率根因）。startupProbe 给最长
        #   5 分钟启动预算，成功前 liveness/readiness 不生效；成功后 60s 判定窗口接管
        # 改动说明（v2.22.4 探针分层）：存活只看进程（/health/live），就绪才看完整检查（/health）。
        #   原三段全打 /health，依赖变慢会把时间耗在健康检查里，探针超时后 liveness 杀进程，形成重启循环。
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60

        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 6

        # 改动说明（v2.22.4）：补 requests 让 API 从 BestEffort 变 Burstable，避免内存紧张时被优先挤压
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          # 改动说明（2026-11-07）：补 memory limit 给 GC 硬边界，避免 GC 视整节点内存为可用而无限扩张
          limits:
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:  
  name: openfindbearings-api
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

