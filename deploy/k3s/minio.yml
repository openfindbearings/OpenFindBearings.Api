# MinIO 对象存储服务（openfindbearings 命名空间共享组件，API 与 Sync 的统图片落点）
# 定位：S3 标准协议对象存储，取代原"API/Sync 各写 hostPath + media nginx 只读挂载"的分散落盘。
#   - bucket: media
#   - key 前缀: uploads/**（API 用户上传：头像/Logo/证照材料）、images/**（Sync 爬虫轴承图/商户 logo）
#   - 数据持久化: local-path PVC（K3s 自带 provisioner），权限由 kubelet 管理，不再有 hostPath chown hack
#   - 读路径: media nginx 反代本服务 9000 端口（URL 形态不变，客户端零改动）
# 部署顺序: 先建 Secret（改 root 凭据）→ apply 本文件 → 按 doc/07 迁移文档建桶/策略/迁移存量
# 镜像用 quay.io（docker.io 集群不可达教训）
---
apiVersion: v1
kind: Secret
metadata:
  name: openfindbearings-minio-secrets
  namespace: openfindbearings
type: Opaque
stringData:
  # 根凭据，部署前必须改掉（K8s Secret 不落仓库，此文件仅为模板）
  MINIO_ROOT_USER: "REPLACE_ME"
  MINIO_ROOT_PASSWORD: "REPLACE_ME_MINIO_ROOT_PASSWORD"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openfindbearings-minio-data
  namespace: openfindbearings
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-minio
  namespace: openfindbearings
  labels:
    app: openfindbearings-minio
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openfindbearings-minio
  template:
    metadata:
      labels:
        app: openfindbearings-minio
    spec:
      containers:
      - name: minio
        image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
          name: s3
        - containerPort: 9001
          name: console
        envFrom:
        - secretRef:
            name: openfindbearings-minio-secrets
        volumeMounts:
        - name: data
          mountPath: /data
        # S3 API 健康端点（官方提供）
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openfindbearings-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: openfindbearings-minio
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-minio
  ports:
  - name: s3
    protocol: TCP
    port: 9000
    targetPort: 9000
  - name: console
    protocol: TCP
    port: 9001
    targetPort: 9001
  type: ClusterIP
