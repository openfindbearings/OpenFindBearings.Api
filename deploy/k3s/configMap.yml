apiVersion: v1
kind: ConfigMap
metadata:
  name: openfindbearings-api-config
  namespace: openfindbearings
data:
  Authentication__Authority: "https://auth.abcsxl.com"
  Authentication__Audience: "openfindbearings-api"
  Authentication__RequireHttpsMetadata: "true"
  CacheSettings__EnableRedis: "false"
  CacheSettings__DefaultExpirationMinutes: "60"
  CacheSettings__MemoryCacheSizeLimit: "200"
  CacheSettings__EnableStatistics: "true"
  Logging__LogLevel__Default: "Warning"
  Logging__LogLevel__Microsoft_AspNetCore: "Warning"
  Logging__LogLevel__Microsoft_EntityFrameworkCore: "Warning"
  Logging__LogLevel__Microsoft_EntityFrameworkCore_Database_Command: "Error"
  AllowedHosts: "*"
  AllowedOrigins__0: "https://www.simate.cn"
  AllowedOrigins__1: "https://simate.cn"
  # 对象存储（v1.5.0）：用户上传统一落 MinIO bucket=media，key 前缀 uploads/**；
  # 凭据在 openfindbearings-api-secrets（FileStorage__AccessKey/SecretKey）
  FileStorage__Provider: "Minio"
  FileStorage__Endpoint: "http://openfindbearings-minio:9000"
  FileStorage__BucketName: "media"
  # 内部服务间调用令牌：BFF→API 带此头豁免按 IP 的用户级限流。须与 BFF 侧 Internal__ApiToken 完全一致。
  # 仅内网生效（API 无公网 ingress），如需轮换改此值并同步 BFF 后重启两服务。
  Internal__ApiToken: "ofb-internal-3f9a1c7e5b2d4a86"