apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-api
  namespace: openfindbearings
  labels:
    app: openfindbearings-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: openfindbearings-api
  template:
    metadata:
      labels:
        app: openfindbearings-api
    spec:
      # 改动说明：头像/执照上传写 wwwroot/uploads——容器内 /app 属 root 而进程 uid 1654
      # 无写权限（同 Identity dpkeys 事故根因），挂 hostPath 卷并由 initContainer 纠权限；
      # 顺带获得持久化（Pod 重启上传图不丢）。镜像复用 API 自身（docker.io 不可达教训）
      initContainers:
      - name: uploads-init
        image: ghcr.io/openfindbearings/openfindbearings-api:v1.0.0
        command: ["sh", "-c", "chown -R 1654:1654 /app/wwwroot/uploads && chmod 700 /app/wwwroot/uploads"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: uploads
          mountPath: /app/wwwroot/uploads
      containers:
      - name: openfindbearings-api
        image: ghcr.io/openfindbearings/openfindbearings-api:v1.0.0
        ports:
        - containerPort: 8080

        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: POD_NETWORK_CIDR
          value: "10.42.0.0/16"  # 根据实际集群配置
        - name: SERVICE_NETWORK_CIDR
          value: "10.43.0.0/16"
        envFrom:
        - secretRef:
            name: openfindbearings-api-secrets
        - configMapRef:
            name: openfindbearings-api-config
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: uploads
        hostPath:
          path: /opt/openfindbearings/api/uploads
          type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:  
  name: openfindbearings-api
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

